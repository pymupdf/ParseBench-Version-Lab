[project]
name = "parsebench-version-lab"
version = "0.1.0"
description = "Local and GitHub Actions runner for ParseBench source-stack benchmarks"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
version-lab = "parsebench_version_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parsebench_version_lab"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

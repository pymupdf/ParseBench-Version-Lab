[project]
name = "parsebench-version-lab"
version = "0.1.0"
description = "Local and GitHub Actions runner for ParseBench source-stack benchmarks"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.0.0",
    "onnxruntime>=1.20.0",
    "parse-bench",
    "psutil>=7.0.0",
    "pyyaml>=6.0.0",
    "rapidocr-onnxruntime==1.2.3",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
rapidocr-modern = [
    "onnxruntime>=1.20.0",
    "rapidocr==3.9.2",
]

[project.scripts]
version-lab = "parsebench_version_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parsebench_version_lab"]

[tool.uv.sources]
parse-bench = { path = "../..", editable = true }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

name: Validate Version Lab Cross-Platform

on:
  workflow_dispatch:
  push:
    branches:
      - codex/validate-version-lab-cross-platform

permissions:
  contents: read

jobs:
  quick-benchmark:
    name: Quick benchmark (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Check out ParseBench
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Activate the Visual C++ build environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install macOS native prerequisites
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install swig tesseract

      - name: Install Windows native prerequisites
        if: runner.os == 'Windows'
        run: choco install swig tesseract --yes --no-progress

      - name: Check native prerequisites
        run: uv run --project tools/version_lab version-lab doctor

      - name: Preview the quick benchmark
        run: uv run --project tools/version_lab version-lab plan --all-latest --scope quick

      - name: Run the quick benchmark
        run: uv run --project tools/version_lab version-lab run --all-latest --scope quick

      - name: Upload benchmark results and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: version-lab-${{ runner.os }}-${{ github.run_id }}
          path: |
            .version-lab/run-*/run.json
            .version-lab/run-*/output
          if-no-files-found: warn

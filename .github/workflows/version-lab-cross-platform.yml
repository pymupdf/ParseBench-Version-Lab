name: Validate Version Lab Cross-Platform

on:
  workflow_dispatch:
  push:
    branches:
      - codex/validate-version-lab-cross-platform

permissions:
  contents: read

jobs:
  quick-benchmark:
    name: Quick benchmark (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      MUPDF_REF: 2e5a1a4ef9ad4f1447bb3cd43a4a59fb087ec6dd
      PYMUPDF_REF: bdde53916c245e796d95a719ce5324c3082bd72c
      PYMUPDF_LAYOUT_REF: 91110937478dea435807ef91a6072363e0abe98d
      PYMUPDF4LLM_REF: d88dd9c6f87206c91f21624e2a12297c015cead7
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-2022

    steps:
      - name: Check out ParseBench
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Activate the Visual C++ build environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install macOS native prerequisites
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install tesseract

      - name: Install Windows native prerequisites
        if: runner.os == 'Windows'
        run: |
          choco install tesseract --yes --no-progress
          "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check native prerequisites
        run: uv run --project tools/version_lab version-lab doctor

      - name: Preview the quick benchmark
        run: >-
          uv run --project tools/version_lab version-lab plan
          --mupdf-ref ${{ env.MUPDF_REF }}
          --pymupdf-ref ${{ env.PYMUPDF_REF }}
          --pymupdf-layout-ref ${{ env.PYMUPDF_LAYOUT_REF }}
          --pymupdf4llm-ref ${{ env.PYMUPDF4LLM_REF }}
          --scope quick

      - name: Run the quick benchmark
        run: >-
          uv run --project tools/version_lab version-lab run
          --mupdf-ref ${{ env.MUPDF_REF }}
          --pymupdf-ref ${{ env.PYMUPDF_REF }}
          --pymupdf-layout-ref ${{ env.PYMUPDF_LAYOUT_REF }}
          --pymupdf4llm-ref ${{ env.PYMUPDF4LLM_REF }}
          --scope quick

      - name: Upload benchmark results and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: version-lab-${{ runner.os }}-${{ github.run_id }}
          path: |
            .version-lab/run-*/run.json
            .version-lab/run-*/output
          if-no-files-found: warn
